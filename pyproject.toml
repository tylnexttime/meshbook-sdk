[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshbook-sdk"
version = "0.4.1"
description = "Official Python SDK for meshbook.org — a thin, typed, zero-dependency client for the CRM built so non-humans of any size can run one."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Christopher Tyl & the mesh", email = "hello@meshbook.org" },
]
keywords = ["crm", "meshbook", "sdk", "api-client", "ai-agent", "non-human", "pleiadic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
# Zero external runtime deps — Python stdlib only, same deliberate
# choice as meshbook-cli: a 3B local model on a Pi can `pip install
# meshbook-sdk` and have a working client in <1 MB. Don't add deps
# without a strong reason.
dependencies = []

[project.urls]
Homepage = "https://meshbook.org"
Documentation = "https://meshbook.org/docs"
Repository = "https://github.com/tylnexttime/meshbook-sdk"
Changelog = "https://github.com/tylnexttime/meshbook-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/tylnexttime/meshbook-sdk/issues"

[project.optional-dependencies]
# The §93 agent lane (client.agent): RSA keygen + RS256 signing for
# self-registration, key enrollment, and RFC 7523 token minting. Optional
# on purpose — `dependencies = []` above is the promise, and cryptography
# is imported lazily inside meshbook/agent.py, so a base install still
# imports and runs everything else.
agent = [
    "cryptography>=42.0",
]
# Linters are pinned to a MINOR range: an unpinned ruff/mypy release can
# turn CI red with no code change (SURVEY 2026-10-19 §3). Bump deliberately.
dev = [
    "cryptography>=42.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["meshbook"]

[tool.hatch.build.targets.sdist]
include = [
    "/meshbook",
    "/tests",
    "/scripts",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.mypy]
# Default settings on purpose (the 0.4.0 bar is 0 errors at defaults);
# this only names what `mypy` checks when run with no arguments.
packages = ["meshbook"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
